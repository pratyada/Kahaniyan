name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install & Build
        run: cd client && npm ci && npm run build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy assets (immutable cache)
        run: aws s3 sync client/dist/assets/ s3://mysleepytale-app/assets/ --delete --cache-control "public, max-age=31536000, immutable"

      - name: Deploy HTML + config
        run: |
          aws s3 cp client/dist/index.html s3://mysleepytale-app/index.html --cache-control "no-cache" --content-type "text/html"
          aws s3 sync client/dist/blog/ s3://mysleepytale-app/blog/ --cache-control "public, max-age=3600" --content-type "text/html"
          aws s3 cp client/dist/robots.txt s3://mysleepytale-app/robots.txt --cache-control "public, max-age=86400" --content-type "text/plain"
          aws s3 cp client/dist/sitemap.xml s3://mysleepytale-app/sitemap.xml --cache-control "public, max-age=3600" --content-type "application/xml"
          aws s3 cp client/dist/favicon.svg s3://mysleepytale-app/favicon.svg --cache-control "public, max-age=604800" || true
          aws s3 cp client/dist/bg-night.svg s3://mysleepytale-app/bg-night.svg --cache-control "public, max-age=604800" || true
          aws s3 cp client/dist/og-cover.svg s3://mysleepytale-app/og-cover.svg --cache-control "public, max-age=604800" || true
          aws s3 sync client/dist/og/ s3://mysleepytale-app/og/ --cache-control "public, max-age=604800" --exclude "*.html" --include "*.png" --content-type "image/png" || true
          aws s3 sync client/dist/og/ s3://mysleepytale-app/og/ --cache-control "public, max-age=604800" --exclude "*.html" --include "*.jpg" --content-type "image/jpeg" || true

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2SUVVWBBFCBPE --paths "/index.html" "/blog/*" "/robots.txt" "/sitemap.xml"

  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Lambda
        run: |
          mkdir -p /tmp/lambda-pkg
          cp -r api /tmp/lambda-pkg/api
          cp -r server /tmp/lambda-pkg/server
          cp .github/lambda-handler.mjs /tmp/lambda-pkg/index.mjs
          cd /tmp/lambda-pkg
          echo '{"type":"module","dependencies":{"stripe":"^14.0.0","firebase-admin":"^13.0.0","@aws-sdk/client-ses":"^3.0.0"}}' > package.json
          npm install --production
          zip -r /tmp/lambda.zip .

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Lambda
        run: aws lambda update-function-code --function-name mysleepytale-api --zip-file fileb:///tmp/lambda.zip
